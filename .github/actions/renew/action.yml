name: renew-kit runner
description: >-
  跑一个续期脚本：装好系统/ Python 依赖与 renewkit，执行脚本，
  失败时兜底发 Telegram 通知并可上传排障产物。
  面板凭据通过调用方 step 的 env 传入即可（composite action 会继承），无需在此声明。

inputs:
  script:
    description: 要执行的脚本路径（相对 working-directory）
    required: true
  python-version:
    description: Python 版本
    required: false
    default: "3.12"
  pip-cache:
    description: >-
      pip 缓存：auto（默认，检测到 requirements.txt/pyproject.toml 才开）/
      true（强制开）/ false（强制关）。
      注意：仓库没有依赖文件时 setup-python 的 cache=pip 会直接报
      "No file ... matched to [**/requirements.txt or **/pyproject.toml]" 并失败，
      所以默认 auto 而不是 true。
    required: false
    default: "auto"
  requirements:
    description: 额外的 requirements 文件（可选；不填则自动用 requirements.txt）
    required: false
    default: ""
  pip-packages:
    description: 直接 pip 安装的包，空格分隔（如 "seleniumbase requests"）
    required: false
    default: ""
  working-directory:
    description: 工作目录
    required: false
    default: "."
  install-renewkit:
    description: 是否安装 renewkit（脚本已 vendored 时可关掉）
    required: false
    default: "true"
  renewkit-ref:
    description: renewkit 的 git ref
    required: false
    default: "main"
  apt-packages:
    description: 需要 apt 安装的系统包，空格分隔（如 "xvfb x11-utils scrot"）
    required: false
    default: ""
  setup-command:
    description: 主脚本执行前的准备命令（如挂代理：bash ./setup_proxy.sh）
    required: false
    default: ""
  setup-continue-on-error:
    description: setup-command 失败是否继续
    required: false
    default: "true"
  command:
    description: 覆盖主命令（默认 `python <script>`，如 "xvfb-run --auto-servernum python3 app.py"）
    required: false
    default: ""
  artifact-paths:
    description: 失败时上传的排障产物路径（多行，如 "*.png\nlatest_logs/"）
    required: false
    default: ""
  artifact-name:
    description: 产物名
    required: false
    default: "failure-artifacts"
  notify-on-failure:
    description: 脚本失败时兜底发一条 Telegram 通知
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install apt packages
      if: inputs.apt-packages != ''
      shell: bash
      run: |
        set -euo pipefail
        # Acquire::Retries 抵御镜像偶发抖动（实测 fonts-noto-cjk 61MB 曾在
        # azure.archive.ubuntu.com 上卡 548s）
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 ${{ inputs.apt-packages }}

    - name: Resolve pip cache mode
      id: pipcache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        mode="${{ inputs.pip-cache }}"
        if [ "$mode" = "false" ]; then
          echo "value=" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ "$mode" = "true" ]; then
          echo "value=pip" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # auto：没有依赖文件就关缓存，否则 setup-python 会硬失败
        if find . -maxdepth 3 -not -path './.git/*' \
             \( -name requirements.txt -o -name pyproject.toml \) -print -quit | grep -q .; then
          echo "value=pip" >> "$GITHUB_OUTPUT"
          echo "pip cache: 开启（检测到依赖文件）"
        else
          echo "value=" >> "$GITHUB_OUTPUT"
          echo "pip cache: 关闭（未检测到 requirements.txt / pyproject.toml）"
        fi

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ steps.pipcache.outputs.value }}

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ "${{ inputs.install-renewkit }}" = "true" ]; then
          pip install "renewkit @ git+https://github.com/${{ github.repository_owner }}/renew-kit@${{ inputs.renewkit-ref }}"
        fi
        REQ="${{ inputs.requirements }}"
        if [ -n "$REQ" ] && [ -f "$REQ" ]; then
          pip install -r "$REQ"
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -n "${{ inputs.pip-packages }}" ]; then
          pip install ${{ inputs.pip-packages }}
        fi

    - name: Setup (pre-run)
      if: inputs.setup-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: ${{ inputs.setup-continue-on-error == 'true' }}
      run: |
        set -uo pipefail
        ${{ inputs.setup-command }}

    - name: Run renewal script
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        if [ -n "${{ inputs.command }}" ]; then
          ${{ inputs.command }}
        else
          python "${{ inputs.script }}"
        fi

    - name: Upload failure artifacts
      if: failure() && inputs.artifact-paths != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-paths }}
        if-no-files-found: ignore
        retention-days: 3

    - name: Fallback Telegram notice on failure
      if: failure() && inputs.notify-on-failure == 'true'
      shell: bash
      run: |
        set -uo pipefail
        TOKEN="${TG_BOT_TOKEN:-${TELEGRAM_TOKEN:-}}"
        CHAT="${TG_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}"
        if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
          echo "未配置 Telegram，跳过兜底通知"
          exit 0
        fi
        TEXT="🚨 ${{ github.repository }} · 续期脚本异常退出
        ℹ️ 运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -sS --max-time 20 -o /dev/null \
          "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT}" \
          --data-urlencode "text=${TEXT}" || true
